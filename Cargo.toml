[package]
name = "throwie-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
inflate = "0.4.5"
num = "0.4.3"
num_enum = "0.7.3"
thiserror = "2.0.4"
tokio = { version = "1.42.0", features = ["full", "socket2"] }
prost = "0.13.3"
prost-types = "0.13.3"
serde = "1.0.215"
serde_derive = "1.0.215"
toml = "0.8.19"
socket2 = { version = "0.5.8"}
num_cpus = "1.16.0"
dashmap = "6.1.0"
ringbuffer = "*"
tokio-postgres = {  version = "0.7.12", features = ["with-chrono-0_4"] }
futures = "0.3.31"
chrono = "0.4.38"

[build-dependencies]
protoc-rust = "3.0.0-alpha.2"
prost-build = "0.13.3"
